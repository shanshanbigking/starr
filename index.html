  <main id="app"></main><script>/* Offline journal-to-PNG renderer. No external scripts or network service required. */
(() => {
  'use strict';

  const PAGE_WIDTH = 1064;
  const XHTML = 'http://www.w3.org/1999/xhtml';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const OMIT = 'script,style,link,dialog,.popover,.toast,.page-export-trigger,[data-export-exclude],[data-page-export-ignore]';
  const imageCache = new Map();
  const skipProperties = new Set(['animation', 'animation-name', 'transition', 'transition-property', 'caret-color']);

  const clamp = (value, min, max, fallback) => Number.isFinite(Number(value))
    ? Math.min(max, Math.max(min, Number(value))) : fallback;
  const color = (value, fallback) => /^#[0-9a-f]{6}$/i.test(String(value || '')) ? value : fallback;

  function settings(options = {}) {
    return {
      background: ['gradient', 'solid', 'transparent'].includes(options.background) ? options.background : 'gradient',
      color1: color(options.color1, '#bdbdbd'),
      color2: color(options.color2, '#ffffff'),
      padding: Math.round(clamp(options.padding, 0, 400, 108)),
      scale: clamp(options.scale, 0.25, 3, 2)
    };
  }

  function fail(message, cause) {
    const error = new Error(message);
    if (cause) error.cause = cause;
    return error;
  }

  function timeout(promise, milliseconds, message) {
    let timer;
    return Promise.race([
      promise,
      new Promise((_, reject) => { timer = setTimeout(() => reject(fail(message)), milliseconds); })
    ]).finally(() => clearTimeout(timer));
  }

  function waitForImage(img) {
    if (img.complete && img.naturalWidth) return Promise.resolve(img);
    return timeout(new Promise((resolve, reject) => {
      const done = () => { cleanup(); resolve(img); };
      const error = () => { cleanup(); reject(fail('有一张照片尚未加载成功，请稍后重试')); };
      const cleanup = () => { img.removeEventListener('load', done); img.removeEventListener('error', error); };
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', error, { once: true });
    }), 20000, '照片加载超时，请稍后重试');
  }

  function blobDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(fail('照片读取失败', reader.error));
      reader.readAsDataURL(blob);
    });
  }

  function exportAsset(src) {
    const assets = window.PYON_EXPORT_ASSETS || {};
    if (assets[src]) return assets[src];
    let filename = '';
    try { filename = decodeURIComponent(new URL(src, document.baseURI).pathname.split('/').pop()); } catch (_) { /* invalid image URL */ }
    return assets[filename] || '';
  }

  async function embedImage(img) {
    const src = img.currentSrc || img.src;
    if (!src) return '';
    if (/^data:/i.test(src)) return src;
    const provided = exportAsset(src);
    if (provided) return provided;
    if (imageCache.has(src)) return imageCache.get(src);
    const conversion = (async () => {
      await waitForImage(img);
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        return canvas.toDataURL('image/png');
      } catch (_) {
        try {
          const response = await timeout(fetch(src), 15000, '照片读取超时');
          if (!response.ok) throw new Error('Image response ' + response.status);
          return await blobDataUrl(await response.blob());
        } catch (error) {
          throw fail('这张照片无法加入导出图片，请使用打包后的单文件网页，或重新上传该照片', error);
        }
      }
    })();
    imageCache.set(src, conversion);
    try { return await conversion; } catch (error) { imageCache.delete(src); throw error; }
  }

  function syncState(source, clone) {
    const sourceNodes = [source, ...source.querySelectorAll('*')];
    const cloneNodes = [clone, ...clone.querySelectorAll('*')];
    for (let index = 0; index < sourceNodes.length; index++) {
      const from = sourceNodes[index], to = cloneNodes[index];
      if (!to) continue;
      if (from instanceof HTMLInputElement) {
        to.value = from.value;
        to.setAttribute('value', from.value);
        to.checked = from.checked;
        to.toggleAttribute('checked', from.checked);
      } else if (from instanceof HTMLTextAreaElement) {
        to.value = from.value;
        to.textContent = from.value;
      } else if (from instanceof HTMLSelectElement) {
        to.value = from.value;
        [...to.options].forEach((option, optionIndex) => {
          option.selected = from.options[optionIndex].selected;
          option.toggleAttribute('selected', option.selected);
        });
      } else if (from instanceof HTMLImageElement) {
        to.removeAttribute('srcset');
        to.removeAttribute('sizes');
        to.src = from.currentSrc || from.src;
        to.loading = 'eager';
      } else if (from instanceof HTMLDetailsElement) {
        to.open = from.open;
      }
    }
    clone.querySelectorAll(OMIT).forEach(node => node.remove());
  }

  async function createDesktopPage() {
    const shell = document.querySelector('#app .site-shell');
    if (!shell) throw fail('没有找到可以导出的日志页面，请刷新网页后再试');
    const browser = document.querySelector('.decorative-browser');
    const images = [...new Set([
      ...shell.querySelectorAll('img'),
      ...(browser ? browser.querySelectorAll('img') : [])
    ])];
    const embedded = new Map(await Promise.all(images.map(async img => [img.currentSrc || img.src, await embedImage(img)])));
    const frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('tabindex', '-1');
    frame.setAttribute('title', '页面导出临时画布');
    frame.style.cssText = `position:fixed;left:-20000px;top:0;width:${PAGE_WIDTH}px;height:1200px;border:0;pointer-events:none;opacity:0;z-index:-2147483647;`;
    document.body.append(frame);
    try {
      const doc = frame.contentDocument;
      doc.documentElement.lang = document.documentElement.lang || 'zh-CN';
      // The export has its own desktop viewport, even when the live page is
      // open on a phone. Do not inherit mobile text autosizing or page zoom.
      const viewport = doc.createElement('meta');
      viewport.name = 'viewport';
      viewport.content = `width=${PAGE_WIDTH},initial-scale=1`;
      doc.head.append(viewport);
      const base = doc.createElement('base');
      base.href = document.baseURI;
      doc.head.append(base);
      const styleLoads = [];
      for (const source of document.querySelectorAll('style,link[rel="stylesheet"]')) {
        const copy = source.cloneNode(true);
        if (copy.tagName === 'LINK') {
          copy.href = source.href;
          styleLoads.push(timeout(new Promise((resolve, reject) => {
            copy.onload = resolve;
            copy.onerror = () => reject(fail('页面样式加载失败，请使用打包后的单文件网页'));
          }), 15000, '页面样式加载超时'));
        }
        doc.head.append(copy);
      }
      const reset = doc.createElement('style');
      reset.textContent = `html,body{width:${PAGE_WIDTH}px!important;min-width:${PAGE_WIDTH}px!important;max-width:${PAGE_WIDTH}px!important;margin:0!important;padding:0!important;overflow:visible!important;background:transparent!important;zoom:1!important;transform:none!important;-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}html{scrollbar-gutter:auto!important}body{position:static!important}${OMIT}{display:none!important}.site-shell{width:${PAGE_WIDTH}px!important;max-width:${PAGE_WIDTH}px!important}.decorative-browser{width:${PAGE_WIDTH}px!important;max-width:${PAGE_WIDTH}px!important}.page-export-paper{display:block;position:static;width:${PAGE_WIDTH}px;overflow:hidden;border-radius:24px;background:var(--page,#f5f5f5);color:var(--ink,#171717)}.page-export-paper,.page-export-paper>#app,.site-shell{zoom:1!important;transform:none!important}.page-export-paper>#app{display:block}`;
      doc.head.append(reset);
      doc.body.className = document.body.className;
      const paper = doc.createElement('div');
      paper.className = 'page-export-paper';
      if (browser) {
        const clonedBrowser = browser.cloneNode(true);
        syncState(browser, clonedBrowser);
        paper.append(clonedBrowser);
      }
      const main = doc.createElement('main');
      main.id = 'app';
      const clonedShell = shell.cloneNode(true);
      syncState(shell, clonedShell);
      main.append(clonedShell);
      paper.append(main);
      doc.body.append(paper);
      paper.querySelectorAll('img').forEach(img => {
        const src = embedded.get(img.currentSrc || img.src) || exportAsset(img.src);
        if (src) img.src = src;
      });
      await Promise.all(styleLoads);
      if (doc.fonts?.ready) await doc.fonts.ready;
      await Promise.all([...paper.querySelectorAll('img')].map(waitForImage));
      paper.querySelectorAll('[data-album-caption]').forEach(input => {
        input.removeAttribute('placeholder');
        input.style.height = 'auto';
        input.style.height = `${Math.max(48, input.scrollHeight + 2)}px`;
      });
      // Layout is synchronous once styles and images are ready. Unlike animation
      // frames, this also works in background tabs and a hidden preview iframe.
      const height = Math.ceil(Math.max(paper.getBoundingClientRect().height, paper.scrollHeight));
      frame.style.height = `${height}px`;
      return { frame, doc, paper, width: PAGE_WIDTH, height };
    } catch (error) {
      frame.remove();
      throw error;
    }
  }

  function copyStyle(style, target) {
    const declarations = [];
    for (let index = 0; index < style.length; index++) {
      const property = style[index];
      if (skipProperties.has(property) || property.startsWith('--')) continue;
      declarations.push(`${property}:${style.getPropertyValue(property)};`);
    }
    target.setAttribute('style', declarations.join(''));
    target.style.setProperty('animation', 'none', 'important');
    target.style.setProperty('transition', 'none', 'important');
    target.style.setProperty('caret-color', 'transparent', 'important');
  }

  function pseudoContent(content, element) {
    if (!content || content === 'none' || content === 'normal') return null;
    if (content === '""' || content === "''") return '';
    const attribute = content.match(/^attr\(\s*([^\s,)]+).*\)$/);
    if (attribute) return element.getAttribute(attribute[1]) || '';
    if ((content[0] === '"' && content.endsWith('"')) || (content[0] === "'" && content.endsWith("'"))) {
      return content.slice(1, -1).replace(/\\([0-9a-f]{1,6})\s?/gi, (_, code) => String.fromCodePoint(parseInt(code, 16))).replace(/\\(["'\\])/g, '$1');
    }
    return '';
  }

  function makePseudo(source, kind, view, doc) {
    const style = view.getComputedStyle(source, `::${kind}`);
    const content = pseudoContent(style.content, source);
    if (content === null || style.display === 'none') return null;
    const node = doc.createElementNS(XHTML, 'span');
    copyStyle(style, node);
    node.style.setProperty('content', 'none');
    node.setAttribute('data-export-pseudo', kind);
    node.textContent = content;
    return node;
  }

  function replaceControl(source, style, view, doc) {
    const tag = source.tagName.toLowerCase();
    if (!['input', 'textarea', 'select'].includes(tag)) return null;
    if (tag === 'input' && ['hidden', 'file'].includes(source.type)) return doc.createTextNode('');
    const result = doc.createElementNS(XHTML, 'span');
    copyStyle(style, result);
    result.style.setProperty('appearance', 'none');
    result.style.setProperty('-webkit-appearance', 'none');
    result.style.setProperty('vertical-align', style.verticalAlign);
    result.style.setProperty('overflow', 'hidden');
    if (tag === 'select') {
      result.textContent = source.selectedOptions[0]?.textContent || source.value;
      if (!source.multiple) {
        const arrow = doc.createElementNS(XHTML, 'span');
        arrow.textContent = '⌄';
        arrow.style.cssText = 'display:inline-block;margin-left:4px;font-family:Arial,sans-serif;font-size:.8em;vertical-align:1px;';
        result.append(arrow);
      }
      result.style.whiteSpace = 'nowrap';
    } else if (tag === 'input' && ['checkbox', 'radio'].includes(source.type)) {
      result.textContent = source.checked ? '✓' : '';

    publish,'save-draft':()=>{const ed=$('#editor');if(!ed.innerText.trim()&&!ed.querySelector('img'))return toast('先写一点内容吧');if(commit(()=>state.drafts.unshift({id:uid(),html:sanitize(ed.innerHTML),style:{fontSize:ed.style.fontSize,fontFamily:ed.style.fontFamily},text:ed.innerText.trim(),created:Date.now()})))toast('已暂存到草稿箱');},
    font:()=>{const ed=$('#editor'),serif=ed.style.fontFamily.startsWith('Georgia');ed.style.fontFamily=serif?'Arial, Microsoft YaHei, sans-serif':'Georgia, Noto Serif SC, serif';persistEditor();toast(serif?'已切换为无衬线字体':'已切换为衬线字体');},
    'editor-image':()=>chooseFile(src=>{command('insertHTML',`<img src="${src}" alt="日志图片"><br>`);}),
    link:()=>{rememberSelection();const sel=window.getSelection()?.toString()||'';openDialog('插入链接',`<form id="link-form"><label>显示文字<input name="text" value="${escape(sel)}" placeholder="链接文字" required maxlength="200"></label><label>链接地址<input name="url" type="url" placeholder="https://" required></label></form>`,`${cancelButton}<button class="small-button primary" form="link-form" type="submit">插入链接</button>`);},
    'avatar-upload':()=>chooseFile(src=>{if(commit(()=>state.profile.avatar=src)){updateProfile();toast('头像已更新');}}),
    'upload-album':()=>$('#album-input').click(),
    'previous-photo':()=>openLightbox(lightboxIndex-1),'next-photo':()=>openLightbox(lightboxIndex+1),
    'profile-visibility':()=>{state.settings.profilePublic=!state.settings.profilePublic;save();updateProfile();toast(`档案显示为${state.settings.profilePublic?'所有人可见':'仅部分可见'}`);},
    'album-visibility':()=>{state.settings.albumPublic=!state.settings.albumPublic;save();updateProfile();toast(`相册显示为${state.settings.albumPublic?'所有人可见':'仅自己可见'}`);},
    visitors:()=>openDialog('访客记录',`<p style="font-size:36px;text-align:center;margin:10px 0">${escape(state.stats.visitors)}</p><p class="dialog-help" style="text-align:center">当前设置的访客数，可直接点击侧栏数字修改。</p>`),
    export:()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='pyon-homepage-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('主页数据已导出');}
  };
  function bindEvents(){
    document.addEventListener('click',e=>{
      const action=e.target.closest('[data-action]');if(action){actions[action.dataset.action]?.();return;}
      const tabButton=e.target.closest('[data-tab]');if(tabButton){switchTab(tabButton.dataset.tab);return;}
      const photo=e.target.closest('[data-photo]');if(photo){openLightbox(Number(photo.dataset.photo));return;}
      const fmt=e.target.closest('[data-command]');if(fmt){command(fmt.dataset.command);return;}
      const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;$('#filter-label').textContent=f.textContent;renderFeed();closeMenus();return;}
      const del=e.target.closest('[data-delete-post]');if(del){const id=del.dataset.deletePost;openDialog('删除日志','<p class="dialog-help">确定删除这篇日志和它的评论吗？</p>',`${cancelButton}<button class="small-button primary" data-confirm-delete="${id}">删除日志</button>`);return;}
      const confirm=e.target.closest('[data-confirm-delete]');if(confirm){state.posts=state.posts.filter(p=>p.id!==confirm.dataset.confirmDelete);save();renderFeed();$('#dialog').close();toast('日志已删除');return;}
      const edit=e.target.closest('[data-edit-post]');if(edit){const post=state.posts.find(p=>p.id===edit.dataset.editPost);editingPost=post.id;$('#editor').innerHTML=sanitize(post.html||escape(post.text));$('#editor').focus();$('#editor').scrollIntoView({behavior:'smooth',block:'center'});toast('修改后点击发布即可保存');return;}
      const ci=e.target.closest('[data-comment-image]');if(ci){const postId=ci.dataset.commentImage;chooseFile(src=>{commentAttachments.set(postId,src);const area=$(`[data-attachment-for="${postId}"]`);area.hidden=false;area.innerHTML=`<img src="${src}" alt="待发送图片"><span>图片已添加</span><button type="button" data-remove-attachment="${postId}">×</button>`;});return;}
      const ra=e.target.closest('[data-remove-attachment]');if(ra){commentAttachments.delete(ra.dataset.removeAttachment);$(`[data-attachment-for="${ra.dataset.removeAttachment}"]`).hidden=true;return;}
      const dc=e.target.closest('[data-delete-comment]');if(dc){if(commit(()=>{const post=state.posts.find(p=>p.id===dc.dataset.post);post.comments=post.comments.filter(c=>c.id!==dc.dataset.deleteComment);}))renderFeed();return;}
      const ld=e.target.closest('[data-load-draft]');if(ld){const draft=state.drafts.find(d=>d.id===ld.dataset.loadDraft);editingPost=null;savedRange=null;switchTab('journal');$('#editor').innerHTML=sanitize(draft.html);$('#editor').style.fontSize=draft.style?.fontSize||'';$('#editor').style.fontFamily=draft.style?.fontFamily||'';persistEditor();$('#dialog').close();$('#editor').focus();toast('草稿已载入');return;}
      const dd=e.target.closest('[data-delete-draft]');if(dd){state.drafts=state.drafts.filter(d=>d.id!==dd.dataset.deleteDraft);save();openDrafts();return;}
      const dm=e.target.closest('[data-delete-message]');if(dm){state.messages=state.messages.filter(m=>m.id!==dm.dataset.deleteMessage);save();renderWall();return;}
      const dp=e.target.closest('[data-delete-photo]');if(dp){state.photos=state.photos.filter(p=>p.id!==dp.dataset.deletePhoto);save();updateProfile();renderAlbum();$('#dialog').close();toast('照片已删除');return;}
      if(!e.target.closest('.more-wrap')&&!e.target.closest('.feed-controls'))closeMenus();
    });
    $('#more-toggle').addEventListener('click',()=>{const menu=$('#more-menu');menu.hidden=!menu.hidden;$('#more-toggle').setAttribute('aria-expanded',String(!menu.hidden));});
    $('#feed-toggle').addEventListener('click',()=>{const menu=$('#filter-menu');menu.hidden=!menu.hidden;$('#feed-toggle').setAttribute('aria-expanded',String(!menu.hidden));});
    $('#search-toggle').addEventListener('click',()=>{const box=$('#search-controls');box.hidden=!box.hidden;$('#search-toggle').setAttribute('aria-expanded',String(!box.hidden));if(!box.hidden)$('#post-search').focus();});
    $('#post-search').addEventListener('input',e=>{search=e.target.value;renderFeed();});$('#sort-posts').addEventListener('change',e=>{sort=e.target.value;renderFeed();});
    document.addEventListener('input',e=>{if(e.target.matches('[data-comment-for] input'))commentDrafts.set(e.target.closest('form').dataset.commentFor,e.target.value);if(e.target.matches('#wall-form textarea'))wallDraft=e.target.value;if(e.target.matches('#decorative-address')){state.settings.decorativeAddress=e.target.value;e.target.style.width=`${Math.max(2,e.target.value.length)}ch`;save();}if(e.target.matches('[data-album-caption]')){state.albumCaptions[Number(e.target.dataset.albumCaption)]=e.target.value;resizeAlbumCaption(e.target);save();}});
    $('#decorative-address')?.addEventListener('blur',e=>{state.settings.decorativeAddress=e.target.value.trim()||defaultDecorativeAddress;syncDecorativeAddress();save();});
    $('#decorative-address')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();}});
    window.addEventListener('resize',resizeAlbumCaptions);
    document.addEventListener('input',e=>{if(!e.target.matches('[data-stat]'))return;const input=e.target;input.value=input.value.normalize('NFKC').replace(/[^0-9]/g,'').slice(0,9);state.stats[input.dataset.stat]=input.value;resizeStatNumber(input);save();});
    $$('[data-stat]').forEach(input=>{input.addEventListener('blur',()=>{if(!input.value)input.value=defaultStats[input.dataset.stat];state.stats[input.dataset.stat]=input.value;resizeStatNumber(input);save();});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}});});
    window.addEventListener('resize',syncEditableStats);
    $('#refresh-feed').addEventListener('click',()=>{const btn=$('#refresh-feed');btn.classList.add('spin');renderFeed();setTimeout(()=>btn.classList.remove('spin'),650);toast('日志已刷新');});
    $$('.toolbar button').forEach(button=>button.addEventListener('mousedown',e=>{rememberSelection();e.preventDefault();}));
    $('#editor').addEventListener('input',()=>{persistEditor();syncToolbar();});$('#editor').addEventListener('keyup',()=>{rememberSelection();syncToolbar();});$('#editor').addEventListener('mouseup',()=>{rememberSelection();syncToolbar();});
    $('#editor').addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text);persistEditor();});
    $('#font-size').addEventListener('change',e=>{const size=Number(e.target.value)*1.83;const sel=window.getSelection();if(sel.rangeCount&&!sel.isCollapsed&&$('#editor').contains(sel.anchorNode)){restoreSelection();document.execCommand('fontSize',false,'7');$$('#editor font[size="7"]').forEach(el=>{el.removeAttribute('size');el.style.fontSize=`${size}px`;});}else $('#editor').style.fontSize=`${size}px`;persistEditor();});
    $('#font-color').addEventListener('input',e=>{$('#color-dot').style.background=e.target.value;command('foreColor',e.target.value);});
    document.addEventListener('submit',e=>{
      if(e.target.matches('[data-comment-for]')){e.preventDefault();const id=e.target.dataset.commentFor,input=e.target.elements.comment,text=input.value.trim(),image=commentAttachments.get(id);if(!text&&!image){toast('写点评论或添加一张图片吧');input.focus();return;}if(!commit(()=>state.posts.find(p=>p.id===id).comments.push({id:uid(),text,image,created:Date.now()})))return;commentAttachments.delete(id);commentDrafts.delete(id);renderFeed();toast('评论已发送');}
      if(e.target.id==='profile-form'){e.preventDefault();const f=new FormData(e.target);if(!f.get('name').trim())return;if(!commit(()=>Object.assign(state.profile,{name:f.get('name').trim(),mood:f.get('mood').trim(),bio:f.get('bio').trim()})))return;updateProfile();$('#dialog').close();toast('个人资料已保存');}
      if(e.target.id==='settings-form'){e.preventDefault();const f=new FormData(e.target);if(!commit(()=>{state.settings.theme=f.get('theme');state.settings.compact=f.has('compact');}))return;applySettings();$('#dialog').close();toast('主页设置已保存');}
      if(e.target.id==='link-form'){e.preventDefault();const f=new FormData(e.target),url=f.get('url').trim();if(!/^https?:\/\//i.test(url)){toast('请输入以 https:// 或 http:// 开头的网址');return;}$('#dialog').close();command('insertHTML',`<a href="${escape(url)}" target="_blank" rel="noopener noreferrer">${escape(f.get('text'))}</a>`);}
      if(e.target.id==='wall-form'){e.preventDefault();const text=e.target.elements.message.value.trim();if(!text)return;if(!commit(()=>state.messages.unshift({id:uid(),text,created:Date.now()})))return;wallDraft='';renderWall();toast('留言已留下 ♡');}
    });
    $('#album-input').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;let added=0;for(const file of files.slice(0,12)){try{const src=await imageData(file);state.photos.push({id:uid(),src,title:file.name.replace(/\.[^.]+$/,''),created:Date.now()});if(save())added++;else{state.photos.pop();break;}}catch(error){toast(error.message);}}e.target.value='';updateProfile();if(tab==='album')renderAlbum();if(added)toast(`已添加 ${added} 张照片`);});
    $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
    document.addEventListener('keydown',e=>{if($('#dialog').open&&$('#dialog').classList.contains('lightbox')){if(e.key==='ArrowLeft')openLightbox(lightboxIndex-1);if(e.key==='ArrowRight')openLightbox(lightboxIndex+1);}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.activeElement===$('#editor')){e.preventDefault();publish();}if(e.key==='Escape')closeMenus();});
  }
  renderShell();
  if(migrateDefaults)save();
})();
</script>
</body></html>
